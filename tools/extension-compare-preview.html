<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMPR compare preview</title><style>html,body{margin:0;width:100%;height:100%}iframe{width:100%;height:100%;border:0}</style></head><body>
<iframe id="preview" src="../V.0.3-prototype/compare.html" title="COMPR comparison preview"></iframe>
<script>preview.addEventListener('load',()=>{const d=preview.contentDocument;
d.getElementById('overviewPlan').textContent='COMPR Ultimate';d.getElementById('overviewUsage').textContent='Unlimited searches';d.getElementById('overviewBilling').textContent='Renews 24 Sep 2026';d.getElementById('overviewRefresh').remove();
d.getElementById('productCount').textContent='2 items';d.getElementById('insightProducts').textContent='2';d.getElementById('insightCategories').textContent='€64.99';d.getElementById('insightPriceRange').textContent='€25.00';d.getElementById('resultsSummary').textContent='Showing all 2 saved products';
const image='../marketing/organic-tiktok-01/assets/premium-hoodie.png';
const card=(store,price,badge)=>`<article class="product-card ${badge?'cheapest':''}"><div class="badge-slot">${badge?'<span class="cheapest-badge">Lowest saved price</span>':''}</div><div class="product-image-wrapper"><img class="product-image" src="${image}" alt="Nike Solo Swoosh Fleece Hoodie"></div><p class="product-brand">NIKE</p><h2 class="product-name">Nike Solo Swoosh Fleece Hoodie Dark Grey Heather</h2><p class="product-price">${price}</p><p class="price-difference">${badge?'Lowest price among your saved products':'€25.00 above your lowest saved price'}</p><div class="actions"><button class="find-cheaper-button">Find This Cheaper</button><a class="view-button">View product</a><button class="remove-button">Remove</button></div><details class="details-section"><summary>Product details</summary></details><details class="details-section"><summary>Discount codes</summary></details><a class="reviews-link">Store reviews · ${store}</a></article>`;
const products=d.getElementById('products');products.innerHTML=card('Store one','€64.99',true)+card('Store two','€89.99',false)+'<aside class="add-product-card"><span class="add-product-icon">+</span><h2>Add another product</h2><p>Open another product page and save it with COMPR.</p><button>Add item</button></aside>';
});</script></body></html>
