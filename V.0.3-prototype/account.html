<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Sign in to COMPR</title>
  <link rel="stylesheet" href="styles/account.css">
</head>
<body>
  <main class="account-page">
    <header class="account-header">
      <img src="icons/icon48.png" alt="">
      <div><strong>COMPR</strong><span>Compare before you buy.</span></div>
      <select data-language-select aria-label="Language"></select>
    </header>

    <section class="account-panel" aria-labelledby="accountTitle">
      <span class="account-eyebrow">SECURE ACCOUNT ACCESS</span>
      <h1 id="accountTitle">Sign in to COMPR</h1>
      <p class="account-intro">One tap securely connects your saved products and COMPR Pro.</p>
      <button id="appleSignIn" class="apple-sign-in" type="button">Sign in with Apple</button>
      <p id="appleSignInHint">Use the COMPR app to sign in securely with your Apple Account.</p>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <nav class="account-links" aria-label="Account help">
        <a href="https://getcompr.nl/privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
        <a href="https://getcompr.nl/support.html" target="_blank" rel="noopener noreferrer">Support</a>
      </nav>
      <button id="closeAccount" class="close-account" type="button">Back</button>
    </section>
  </main>

  <script src="shared/browserAdapter.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/runtimeConfig.js"></script>
  <script src="shared/auth.js"></script>
  <script src="account.js"></script>
</body>
</html>
